<div class="modal-overlay" id="modal-subscribe">
    <div class="modal-box">
        <button class="modal-close" data-close aria-label="إغلاق">✕</button>
        <h2 class="modal-title">إنشاء حساب</h2>
        <p class="modal-subtitle">انضم إلى Delivo واطلب في ثوانٍ</p>

        <div class="modal-field">
            <label for="reg-name">الاسم الكامل</label>
            <input type="text" id="reg-name" placeholder="محمد علي">
        </div>
        <div class="modal-field">
            <label for="reg-phone">رقم الهاتف</label>
            <input type="tel" id="reg-phone" placeholder="07X XXX XXXX" dir="ltr">
        </div>
        <div class="modal-field">
            <label for="reg-password">كلمة المرور</label>
            <input type="password" id="reg-password" placeholder="••••••••">
        </div>

        <button class="btn-primary" style="width:100%;justify-content:center;padding:12px;">
            إنشاء الحساب
        </button>

        <p class="modal-footer-text">
            عندك حساب؟ <a href="#" data-modal="modal-login" data-close>سجّل الدخول</a>
        </p>
    </div>
</div>

<div class="modal-overlay" id="modal-login">

        <button class="modal-close" data-close aria-label="إغلاق">✕</button>
        <h2 class="modal-title">تسجيل الدخول</h2>
        <p class="modal-subtitle">أدخل بياناتك للمتابعة</p>

        <div class="modal-field">
            <label for="login-phone">رقم الهاتف</label>
            <input type="tel" id="login-phone" placeholder="07X XXX XXXX" dir="ltr">
        </div>
        <div class="modal-field">
            <label for="login-password">كلمة المرور</label>
            <input type="password" id="login-password" placeholder="••••••••">
        </div>

        <button class="btn-primary" style="width:100%;justify-content:center;padding:12px;">
            دخول
        </button>

        <p class="modal-footer-text">
            ما عندك حساب؟ <a href="#" data-modal="modal-subscribe" data-close>سجّل الآن</a>
        </p>
    </div>
</div>

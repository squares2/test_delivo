<section class="categories section">
    <div class="categories__header container">
        <h2 class="section-title">تصفح الأقسام</h2>
    </div>
    <div class="categories__scroll hide-scrollbar">

        <div class="category-item" data-category="restaurants">
            <div class="category-item__circle">
                <img src="assets/cat_burger.png" alt="مطاعم" onerror="this.onerror=null;this.outerHTML='🍔'">
            </div>
            <span class="category-item__label">مطاعم</span>
        </div>

        <div class="category-item" data-category="coffee">
            <div class="category-item__circle">
                <img src="assets/cat_coffee.png" alt="قهوة" onerror="this.onerror=null;this.outerHTML='☕'">
            </div>
            <span class="category-item__label">قهوة</span>
        </div>

        <div class="category-item" data-category="supermarket">
            <div class="category-item__circle">
                <img src="assets/cat_super.png" alt="سوبرماركت" onerror="this.onerror=null;this.outerHTML='🛒'">
            </div>
            <span class="category-item__label">سوبرماركت</span>
        </div>

        <div class="category-item" data-category="sweets">
            <div class="category-item__circle">
                <img src="assets/cat_sweet.png" alt="حلويات" onerror="this.onerror=null;this.outerHTML='🍰'">
            </div>
            <span class="category-item__label">حلويات</span>
        </div>

        <div class="category-item" data-category="meat">
            <div class="category-item__circle">
                <img src="assets/cat_meat.png" alt="ملاحم" onerror="this.onerror=null;this.outerHTML='🥩'">
            </div>
            <span class="category-item__label">ملاحم</span>
        </div>

        <div class="category-item" data-category="fish">
            <div class="category-item__circle">
                <img src="assets/cat_fish.png" alt="أسماك" onerror="this.onerror=null;this.outerHTML='🐟'">
            </div>
            <span class="category-item__label">أسماك</span>
        </div>

    </div>
</section>
